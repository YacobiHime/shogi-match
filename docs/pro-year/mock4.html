<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棋士の1年 操作の見直しのモックアップ</title>
<!--
  棋士の1年の操作の見直し(docs/pro-year-design.mdの16章)のモックアップ。
  行動の持ち越し・1回で選ぶ行動の札・決める場所を1か所に・その場の確認・相手と分身の能力をやこびノートの形に。
  PC(1366×768)4画面とスマホ(390×844)4画面。中身は見本の値で、ボタンは動かない。
  ?real=1 で枠を縮めずに並べる(写真を撮るため)。?only=番号 でその画面だけを出す。
-->
<style>
:root {
  --page: #0f171f;
  --page-ink: #dfe7ee;
  /* 対局画面・大会の画面と同じ色(src/ShogiMatchGame.css) */
  --night: #1d303f;
  --night-deep: #172632;
  --slate: #2b465b;
  --amber: #f1a54c;
  --amber-shadow: #b57c39;
  --ivory: #fffcf4;
  --muted: rgba(255, 252, 244, 0.72);
  --line: rgba(255, 252, 244, 0.18);
  --gold: #e7c15a;
  --ok: #3aa37a;
  --study: #c9b6f0;
  --fest: #e0655a;
  --compare: #8fc5ff;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px 64px; background: var(--page); color: var(--page-ink); font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif; line-height: 1.5; }
.doc { max-width: 1400px; margin: 0 auto; }
.doc > h1 { margin: 0 0 4px; font-size: 1.5rem; }
.doc > p { margin: 0 0 8px; color: #aab7c2; max-width: 64rem; }
.doc > h2 { margin: 40px 0 12px; font-size: 1.15rem; border-left: 4px solid var(--amber); padding-left: 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 410px), 1fr)); gap: 28px 20px; }
.grid--pc { grid-template-columns: 1fr; }
figure { margin: 0; display: grid; gap: 10px; align-content: start; }
figcaption { color: #c9d4dc; font-size: 0.85rem; max-width: 64rem; }
figcaption strong { display: block; color: #fff; font-size: 0.95rem; }
.fit { width: 100%; overflow: hidden; }
.fit > .device { transform-origin: top left; }
.device { position: relative; overflow: hidden; background: var(--night); color: var(--ivory); border-radius: 28px; box-shadow: 0 0 0 10px #05090c, 0 0 0 11px #2b3a46, 0 20px 50px rgba(0, 0, 0, 0.5); font-size: 14px; }
.device--phone { width: 390px; height: 844px; display: flex; flex-direction: column; }
.device--pc { width: 1366px; height: 768px; border-radius: 10px; display: flex; flex-direction: column; }
body.real { padding: 0; background: var(--night); }
body.real .doc > *:not(.grid), body.real figcaption { display: none; }
body.real .grid { display: block; }
body.real figure { display: block; }
body.real .fit { overflow: visible; }
body.real .device { border-radius: 0; box-shadow: none; }

/* ---- 部品 ---- */
.btn { display: inline-grid; place-items: center; align-content: center; min-height: 44px; padding: 0 14px; border: 2px solid rgba(255, 252, 244, 0.35); border-radius: 10px; color: var(--ivory); background: var(--slate); font: inherit; font-weight: 800; line-height: 1.2; }
.btn--amber { border-color: var(--amber-shadow); color: #1d303f; background: var(--amber); box-shadow: 0 3px 0 var(--amber-shadow); font-weight: 900; }
.btn--ghost { background: transparent; }
.btn small { font-size: 0.7rem; font-weight: 700; opacity: 0.85; }
.btn--focus { outline: 3px solid #fff; outline-offset: 2px; }
.topbar { display: flex; align-items: center; gap: 10px; height: 60px; flex: none; padding: 0 14px; border-bottom: 1px solid rgba(241, 165, 76, 0.35); background: #13202b; }
.back { white-space: nowrap; height: 40px; padding: 0 14px; border: 1px solid rgba(255, 252, 244, 0.45); border-radius: 999px; background: transparent; color: var(--ivory); font: inherit; font-weight: 800; }
.seal { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 6px; background: #c2493a; color: #fff; font-weight: 900; }
.title h1 { margin: 0; font-size: 1.05rem; white-space: nowrap; }
.title p { margin: 0; color: var(--muted); font-size: 0.75rem; font-weight: 700; }
.diff { white-space: nowrap; margin-left: auto; padding: 6px 12px; border: 1px solid rgba(255, 252, 244, 0.4); border-radius: 999px; font-size: 0.78rem; font-weight: 800; }
.tabs { display: flex; gap: 6px; }
.tab { height: 34px; padding: 0 14px; border: 1px solid rgba(255, 252, 244, 0.3); border-radius: 999px; background: transparent; color: var(--ivory); font: inherit; font-size: 0.82rem; font-weight: 800; }
.tab.on { border-color: var(--amber); color: #1d303f; background: var(--amber); }

/* 目標の帯 */
.goalbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.3fr); gap: 8px; flex: none; padding: 8px 14px; background: #162531; border-bottom: 1px solid var(--line); }
.goal { display: grid; gap: 3px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--night-deep); font-size: 0.74rem; }
.goal b { font-size: 0.8rem; }
.goal small { color: var(--muted); font-weight: 700; }
.bar { position: relative; height: 6px; border-radius: 3px; background: rgba(255, 252, 244, 0.15); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--amber); }
.bigone { display: grid; gap: 1px; padding: 5px 12px; border: 2px solid var(--gold); border-radius: 8px; background: rgba(231, 193, 90, 0.12); font-size: 0.74rem; }
.bigone b { font-size: 0.84rem; }

/* 今週の札(主役。選ぶものと決めるボタンを1枚に入れる) */
.week { display: grid; grid-template-rows: auto auto auto 1fr auto; gap: 10px; min-height: 0; padding: 12px 14px; border: 2px solid rgba(241, 165, 76, 0.55); border-radius: 14px; background: var(--night-deep); }
.week-head { display: flex; align-items: baseline; gap: 10px; }
.week-head h2 { margin: 0; color: var(--amber); font-size: 1.2rem; }
.week-head h2 small { margin-left: 8px; color: var(--muted); font-size: 0.8rem; }
.cond { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 800; }
.cond i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 252, 244, 0.2); }
.cond i.on { background: #7bd3a8; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 0; padding: 0; list-style: none; }
.strip li { display: grid; justify-items: center; padding: 3px 0; border-radius: 7px; background: rgba(255, 252, 244, 0.06); font-size: 0.72rem; }
.strip li b { font-size: 0.95rem; }
.strip li.today { outline: 2px solid var(--amber); }
.strip li.past { opacity: 0.45; }
.mk { padding: 0 5px; border-radius: 4px; color: #1d303f; font-size: 0.66rem; font-weight: 900; }
.mk--game { background: var(--amber); }
.mk--study { background: var(--study); }
.mk--fest { color: #fff; background: var(--fest); }
.subhead { display: flex; align-items: baseline; gap: 8px; margin: 0; font-size: 0.92rem; }
.subhead small { color: var(--muted); font-size: 0.74rem; font-weight: 700; }
.carry { padding: 1px 8px; border: 1px solid rgba(123, 211, 168, 0.7); border-radius: 999px; color: #a9e6c6; font-size: 0.68rem; font-weight: 800; }

/* 行動の札(1回押すと入る。番号の印で何番目か) */
.palette { display: grid; gap: 6px; align-content: start; min-height: 0; }
.palette-row { display: grid; grid-template-columns: 4.6em repeat(3, minmax(0, 1fr)); gap: 6px; align-items: stretch; }
.palette-row > span { align-self: center; color: var(--muted); font-size: 0.72rem; font-weight: 800; }
.act { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 2px 8px; align-items: center; min-height: 54px; padding: 6px 10px; border: 2px solid rgba(255, 252, 244, 0.22); border-radius: 10px; background: rgba(255, 252, 244, 0.05); text-align: left; }
.act .ic { grid-row: span 2; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; background: var(--slate); font-weight: 900; }
.act b { font-size: 0.86rem; }
.act small { color: var(--muted); font-size: 0.7rem; font-weight: 700; line-height: 1.25; }
.act em { color: #a9e6c6; font-style: normal; }
.act.on { border-color: var(--amber); background: rgba(241, 165, 76, 0.16); }
.act.on .ic { color: #1d303f; background: var(--amber); }
.act .no { position: absolute; top: -8px; right: -6px; display: grid; place-items: center; width: 22px; height: 22px; border: 2px solid var(--night-deep); border-radius: 50%; color: #1d303f; background: var(--amber); font-size: 0.72rem; font-weight: 900; }
.act.off { opacity: 0.4; }
.act .drop { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.7rem; }

/* 決める列(札の下の端。右下に決めるボタン) */
.decide { display: flex; align-items: center; gap: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.decide .talk { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; color: var(--muted); font-size: 0.8rem; font-weight: 700; }
.face { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #f4e9ff; color: #6a4aa6; font-weight: 900; font-size: 0.8rem; }
.decide .btn { min-height: 52px; }
.decide .go { min-width: 13rem; font-size: 1.05rem; }

/* 右の列(見るもの) */
.side { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 8px; min-height: 0; }
.side-rows { display: grid; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--night-deep); font-size: 0.8rem; }
.row .ic { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; background: var(--slate); font-weight: 900; }
.row small { color: var(--muted); font-weight: 700; }
.row .more { margin-left: auto; color: var(--amber); font-weight: 800; font-size: 0.74rem; }
.news { display: grid; gap: 1px; padding: 6px 12px; border-left: 6px solid #c2493a; border-radius: 8px; color: #2a2116; background: #f6efe0; }
.news small { color: #8a5a2b; font-size: 0.68rem; font-weight: 800; }
.news b { font-size: 0.92rem; }
.pane { min-height: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--night-deep); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; font-size: 0.7rem; }
.cal > span { display: grid; align-content: start; height: 46px; padding: 2px 4px; border-radius: 5px; background: rgba(255, 252, 244, 0.05); }
.cal > span.h { height: auto; background: none; text-align: center; color: var(--muted); font-weight: 800; }
.cal > span.now { outline: 2px solid var(--amber); }
.cal i { margin-top: 2px; padding: 0 3px; border-radius: 3px; color: #1d303f; font-style: normal; font-weight: 900; font-size: 0.62rem; }
.cal i.t { background: #e6c88c; }
.cal i.g { background: var(--amber); }
.cal i.s { background: var(--study); }

/* 対局の札(今週の札の中) */
.game { display: grid; gap: 6px; align-content: start; align-self: start; padding: 10px 12px; border: 2px solid rgba(123, 211, 168, 0.55); border-radius: 12px; background: rgba(123, 211, 168, 0.06); }
.game-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 0.86rem; }
.game-head b:first-child { color: var(--amber); font-size: 1rem; }
.weight { padding: 1px 8px; border-radius: 999px; color: #1d303f; background: #cfd9e2; font-size: 0.7rem; font-weight: 900; }
.vs { display: flex; align-items: center; gap: 10px; }
.vs strong { font-size: 1.25rem; }
.vs small { color: var(--muted); font-weight: 700; }
.scouter { margin-left: auto; padding: 4px 12px; border: 2px solid var(--amber); border-radius: 999px; color: #3a1d06; background: linear-gradient(180deg, #ffd38a, #f1a54c); font-size: 0.78rem; font-weight: 900; }
.prep { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 0.76rem; font-weight: 700; }
.prep { align-items: center; }
.prep b { align-self: center; padding: 0 7px; border-radius: 5px; color: #1d303f; background: #cfd9e2; }
.ranks-mini { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; list-style: none; font-size: 0.72rem; font-weight: 700; }
.ranks-mini li { display: inline-flex; align-items: center; gap: 3px; }
.ranks-mini .open { margin-left: auto; color: var(--amber); font-weight: 800; }
.ways { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.ways .btn { min-height: 54px; }
.confirm { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 8px 10px; border: 2px solid var(--amber); border-radius: 12px; background: rgba(241, 165, 76, 0.12); }
.confirm p { margin: 0; font-size: 0.86rem; font-weight: 900; }
.confirm p small { display: block; color: var(--muted); font-size: 0.72rem; font-weight: 700; }
.confirm .btn { min-height: 54px; min-width: 9.5rem; }
.done-acts { margin: 0; color: var(--muted); font-size: 0.78rem; font-weight: 700; }

/* 能力(PlayerAbilityPanelと同じ見た目) */
.ability { display: grid; gap: 8px; min-height: 0; }
.ability h3 { display: flex; align-items: baseline; gap: 8px; margin: 0; font-size: 0.95rem; }
.ability h3 small { color: var(--muted); font-size: 0.74rem; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { padding: 3px 10px; border: 1px solid rgba(255, 252, 244, 0.35); border-radius: 999px; font-size: 0.72rem; font-weight: 800; }
.chip.on { border-color: var(--compare); color: #0f2233; background: var(--compare); }
.radar { display: block; width: 100%; height: auto; }
.radar .grid polygon { fill: none; stroke: rgba(255, 252, 244, 0.22); stroke-width: 1; }
.radar .grid line { stroke: rgba(255, 252, 244, 0.22); stroke-width: 1; }
.radar .area { fill: rgba(241, 165, 76, 0.35); stroke: #f1a54c; stroke-width: 2; stroke-linejoin: round; }
.radar .cmp { fill: rgba(143, 197, 255, 0.12); stroke: var(--compare); stroke-width: 2.5; stroke-dasharray: 6 4; stroke-linejoin: round; }
.radar .dot { fill: #f1a54c; stroke: #172632; stroke-width: 1.5; }
.radar .lb { fill: #fffcf4; font-size: 21px; font-weight: 700; }
.radar .vl { fill: #f1a54c; font-size: 18px; font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; font-size: 0.74rem; font-weight: 700; }
.legend span::before { display: inline-block; width: 1.6em; margin-right: 0.35em; vertical-align: middle; border-top: 3px solid #f1a54c; content: ""; }
.legend span.c::before { border-top: 3px dashed var(--compare); }
.rk { display: grid; grid-template-columns: repeat(2, max-content); column-gap: 1.4rem; row-gap: 3px; margin: 0; padding: 0; list-style: none; font-size: 0.8rem; }
.rk li { display: grid; grid-template-columns: 3.6em 1.7em 2em 1.4em; align-items: center; gap: 4px; }
.rk .lbl { font-weight: 700; font-size: 0.78rem; }
.rk .val { color: var(--muted); font-size: 0.74rem; text-align: right; }
.rk .cr { color: var(--compare); font-weight: 900; text-align: center; font-size: 0.78rem; }
.r { display: inline-grid; place-items: center; width: 1.7em; height: 1.5em; border-radius: 3px; color: #172632; font-weight: 900; font-size: 0.9rem; }
.r--S { background: #f1a54c; box-shadow: 0 0 0 2px #fff3d6 inset; }
.r--A { background: #f1a54c; }
.r--B { background: #e6c88c; }
.r--C { background: #b9d18e; }
.r--D { background: #8ec5cf; }
.r--E { background: #a9b6c4; }
.r--F, .r--G { color: #fffcf4; background: #55697d; }
.ranks-mini .r { width: 1.5em; height: 1.35em; font-size: 0.78rem; }
.type { margin: 0; color: var(--amber); font-size: 0.8rem; font-weight: 800; }
.phases { display: flex; gap: 12px; margin: 0; font-size: 0.78rem; font-weight: 700; }
.phases span { display: inline-flex; align-items: center; gap: 4px; }
.specials { display: flex; flex-wrap: wrap; gap: 5px; margin: 0; padding: 0; list-style: none; }
.sp { padding: 2px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 800; }
.sp--gold { color: #172632; background: linear-gradient(135deg, #ffe29a, #f1a54c); }
.sp--blue { color: #fffcf4; background: #2f6fa8; }
.sp--red { color: #fffcf4; background: #a8463f; }
.usage { display: grid; gap: 3px; margin: 0; padding: 0; list-style: none; font-size: 0.74rem; }
.usage li { display: grid; grid-template-columns: 7.5em minmax(2rem, 1fr) 2.6em; gap: 6px; align-items: center; }
.usage i { display: block; height: 7px; border-radius: 999px; background: #4d8ac4; }
.usage i.rg { background: #c56a5f; }
.grow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px 14px; margin: 0; padding: 0; list-style: none; font-size: 0.72rem; }
.grow li { display: grid; grid-template-columns: 3.6em 2.6em minmax(2rem, 1fr); gap: 5px; align-items: center; }
.grow li b { color: #a9e6c6; }
.grow .track { height: 6px; border-radius: 3px; background: rgba(255, 252, 244, 0.15); overflow: hidden; }
.grow .track i { display: block; height: 100%; background: var(--ok); }
.note { margin: 0; color: var(--muted); font-size: 0.72rem; font-weight: 700; line-height: 1.5; }
.card { display: grid; gap: 8px; align-content: start; min-height: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--night-deep); }
.says { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; color: #1d303f; background: #fffcf4; font-size: 0.8rem; font-weight: 700; }

/* シート(重ねる) */
.veil { position: absolute; inset: 0; display: grid; place-items: center; padding: 14px; background: rgba(5, 9, 12, 0.6); }
.sheet { display: grid; gap: 10px; width: 100%; max-height: 100%; overflow: hidden; padding: 14px 16px; border: 2px solid rgba(201, 182, 240, 0.7); border-radius: 14px; background: var(--night); }
.sheet h2 { display: flex; align-items: baseline; gap: 8px; margin: 0; color: var(--amber); font-size: 1.05rem; }
.sheet h2 small { color: var(--muted); font-size: 0.74rem; }
.close { margin-left: auto; display: grid; place-items: center; width: 40px; height: 40px; border: 2px solid rgba(255, 252, 244, 0.4); border-radius: 50%; color: var(--ivory); font-weight: 900; }
.dim { filter: brightness(0.55); }

/* PCの並び */
.pc-main { display: grid; grid-template-columns: 790px minmax(0, 1fr); gap: 12px; min-height: 0; flex: 1; padding: 10px 12px; }

/* スマホの並び */
.ph-goals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; flex: none; padding: 6px 8px; background: #162531; border-bottom: 1px solid var(--line); }
.ph-goals .goal { padding: 3px 6px; font-size: 0.68rem; }
.ph-goals .goal b { overflow: hidden; font-size: 0.7rem; text-overflow: ellipsis; white-space: nowrap; }
.ph-big { flex: none; margin: 6px 8px 0; padding: 4px 10px; border: 2px solid var(--gold); border-radius: 8px; background: rgba(231, 193, 90, 0.12); font-size: 0.72rem; font-weight: 800; }
.ph-tabs { display: flex; gap: 5px; flex: none; padding: 6px 8px; }
.ph-tabs .tab { height: 32px; padding: 0 11px; font-size: 0.76rem; }
.ph-body { flex: 1; min-height: 0; overflow: hidden; display: grid; gap: 8px; align-content: start; padding: 0 8px; }
.ph-body .week { grid-template-rows: none; padding: 10px; border-width: 1px; }
.ph-body .palette-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ph-body .palette-row > span { grid-column: 1 / -1; }
.ph-bar { display: grid; gap: 6px; flex: none; padding: 8px 8px 14px; border-top: 1px solid rgba(241, 165, 76, 0.4); background: #13202b; }
.ph-bar .talk { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.74rem; font-weight: 700; }
.ph-bar .two { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
.ph-bar .btn { min-height: 52px; }
.ph-bar .ways .btn { min-height: 56px; font-size: 0.82rem; }
.ph-bar .confirm { grid-template-columns: 1fr 1fr; }
.ph-bar .confirm p { grid-column: 1 / -1; }
.ph-bar .confirm .btn { min-width: 0; }
</style>
</head>
<body>
<main class="doc">
  <h1>棋士の1年 操作の見直し（16章）</h1>
  <p>行動は先週の選び方を持ち越して空けない。行動は1回押せば入る札にする。選ぶものと決めるボタンを今週の札の1枚に入れ、決めるボタンは札の右下に置く。分身に任せるの確認は、押したボタンの場所で答える。相手と分身の能力は、やこびノートの「能力」と同じ部品（レーダーチャート・ランクの文字・比べる点線）で見せる。</p>

function radar(values, compare, { width = 300 } = {}) {
  const size = 360, margin = 60, c = size / 2, rad = 108;
  const pt = (i, v) => { const a = -Math.PI / 2 + (i / 8) * Math.PI * 2; const r = (rad * v) / 100; return [c + Math.cos(a) * r, c + Math.sin(a) * r]; };
  const poly = (vals) => vals.map((v, i) => pt(i, v).map((n) => n.toFixed(1)).join(",")).join(" ");
  const rings = [20, 40, 60, 80, 100].map((g) => `<polygon points="${poly(Array(8).fill(g))}"/>`).join("");
  const lines = AX.map((_, i) => { const [x, y] = pt(i, 100); return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}"/>`; }).join("");
  const labels = AX.map((label, i) => {
    const [x, y] = pt(i, 128);
    const anchor = x < c - 4 ? "end" : x > c + 4 ? "start" : "middle";
    return `<text class="lb" x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle">${label}</text><text class="vl" x="${x}" y="${y + 20}" text-anchor="${anchor}" dominant-baseline="middle">${values[i]}</text>`;
  }).join("");
  const dots = values.map((v, i) => { const [x, y] = pt(i, v); return `<circle class="dot" cx="${x}" cy="${y}" r="3.5"/>`; }).join("");
  return `<svg class="radar" style="max-width:${width}px;margin:0 auto" viewBox="${-margin} 0 ${size + margin * 2} ${size}"><g class="grid">${rings}${lines}</g>${compare ? `<polygon class="cmp" points="${poly(compare)}"/>` : ""}<polygon class="area" points="${poly(values)}"/>${dots}${labels}</svg>`;
}

      <div class="ph-body dim"></div>
      <div class="veil" style="top:60px;align-items:end;padding:8px">
        <div class="sheet ability" style="gap:6px">
          <h2>分身の能力<small>あなた＋育てた分</small><span class="close">×</span></h2>
          <div class="chips"><span class="chip on">今週のはじめ</span><span class="chip">次の相手</span><span class="chip">組の平均</span></div>
          ${radar(ME, ME0, { width: 280 })}
          ${legend("いまの分身", "今週のはじめ")}
          ${ranksGrid(ME, ME0)}
          <p class="type">受け将棋・粘り強い</p>
          <p class="subhead">分身の育ち<small>任せる強さ ＋9</small></p>
          <ul class="grow">${AX.map((a, i) => `<li><span>${a}</span><b>Lv${[2, 1, 1, 1, 2, 3, 1, 1][i]}</b><span class="track"><i style="width:${[50, 25, 0, 50, 20, 40, 75, 25][i]}%"></i></span></li>`).join("")}</ul>
        </div>
      </div>`,
  },
];

const figure = (item, kind) => `<figure data-shot="${item.id}"><div class="fit"><div class="device device--${kind}">${item.html}</div></div><figcaption><strong>${item.title}</strong>${item.note}</figcaption></figure>`;
document.getElementById("pc").innerHTML = pc.map((item) => figure(item, "pc")).join("");
document.getElementById("phone").innerHTML = phone.map((item) => figure(item, "phone")).join("");

const params = new URLSearchParams(location.search);
const real = params.has("real");
if (params.has("only")) {
  for (const fig of document.querySelectorAll("figure[data-shot]")) if (fig.dataset.shot !== params.get("only")) fig.remove();
  for (const grid of document.querySelectorAll(".grid")) if (!grid.children.length) grid.remove();
}
if (real) document.body.classList.add("real");
function fit() {
  if (real) return;
  for (const box of document.querySelectorAll(".fit")) {
    const device = box.firstElementChild;
    const width = device.offsetWidth + 22;
    const scale = Math.min(1, box.clientWidth / width);
    device.style.transform = `translate(11px, 11px) scale(${scale})`;
    box.style.height = `${(device.offsetHeight + 22) * scale}px`;
  }
}
addEventListener("resize", fit);
fit();
</script>
</body>
</html>
