name: 展示用Windows exeを作成

on:
  workflow_dispatch:
  push:
    branches: [build/exhibit-windows-download]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:exhibit:exe
      - uses: actions/upload-artifact@v4
        with:
          name: shogi-match-exhibit-windows-x64
          path: exhibit/shogi-match-exhibit-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
