<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Googleでログイン｜shogi-match</title>
  <!--
    Googleアカウントで同期するためのログインのページ(docs/cloud-sync-design.mdの5章)。
    対局画面はエンジンのためにCOOP/COEPの見出しを返すので、Googleの窓を開くこのページだけ別にする(firebase.jsonで見出しを変える)。
    中身はdist/auth/login.js(src/auth/login-page.ts)。
  -->
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #1d303f; color: #fffcf4; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
      font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      line-height: 1.6;
    }
    .login {
      width: min(30em, 100%);
      padding: 1.4em 1.4em 1.2em;
      border: 2px solid rgba(255, 252, 244, 0.45);
      border-radius: 1em;
      background: rgba(255, 252, 244, 0.06);
      text-align: center;
    }
    .login h1 { margin: 0 0 0.6em; font-size: 1.35em; }
    .login ul { margin: 0 0 1.2em; padding-left: 1.2em; text-align: left; font-size: 0.95em; }
    .login li + li { margin-top: 0.3em; }
    .login__google {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.7em;
      min-height: 48px;
      width: min(18em, 100%);
      padding: 0.5em 1.2em;
      border: 1px solid #747775;
      border-radius: 999px;
      background: #ffffff;
      color: #1f1f1f;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .login__google:disabled { opacity: 0.6; cursor: wait; }
    .login__google:focus-visible, .login__back:focus-visible { outline: 3px solid #f1a54c; outline-offset: 3px; }
    .login__google svg { width: 20px; height: 20px; flex: none; }
    .login__message { min-height: 1.6em; margin: 0.8em 0 0; font-weight: 700; }
    .login__message--error { color: #f6b2ae; }
    .login__back {
      display: inline-block;
      margin-top: 0.8em;
      padding: 0.5em 1em;
      min-height: 44px;
      border: 2px solid #fffcf4;
      border-radius: 999px;
      color: #fffcf4;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="login" data-login>
    <h1>Googleでログイン</h1>
    <ul>
      <li>ログインすると、記録をGoogleアカウントにひもづけて保存し、ほかの端末でも同じ記録で遊べるよ。</li>
      <li>使うのは、アカウントの番号と、この端末に出すメールアドレスと名前だけ。</li>
      <li>ログアウトしても、この端末の記録はそのまま残るよ。</li>
    </ul>
    <button type="button" class="login__google" data-login-google disabled>
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span>Googleでログイン</span>
    </button>
    <p class="login__message" role="status" data-login-message></p>
    <a class="login__back" href="./" data-login-back>ゲームに戻る</a>
  </main>
  <script type="module" src="./dist/auth/login.js"></script>
</body>
</html>
